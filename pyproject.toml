[project]
name = "weatherstar-4000"
version = "0.1.0"
description = "Weatherstar 4000 Simulator"
readme = "README.md"
authors = [
    { name = "Bobby Ball", email = "bobbyjball3@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "colorama>=0.4.6",
    "ephem>=4.1.0",
    "pillow==12.2.0",
    "pydantic>=2.0",
    "pygame==2.6.1",
    "pyttsx3>=2.90",
    "requests==2.33.0",
    "structlog>=26.1.0",
    "tomli>=2.0 ; python_full_version < '3.11'",
]

[project.scripts]
weatherstar4000 = "weatherstar_4000.cli:main"

# External plugins register here (built-ins register via the built-in registry).
[project.entry-points."weatherstar4000.plugins"]
placeholder = "weatherstar_4000.plugins"

[dependency-groups]
dev = [
    "pre-commit>=3.5",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "W"]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
known-first-party = ["weatherstar_4000"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--continue-on-collection-errors --junitxml=reports/junit.xml"

[tool.coverage.run]
source = ["src/weatherstar_4000"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Ratchet: rendering is exercised headlessly via populated-data screen tests;
# coverage currently sits around 85%. Raise fail_under as coverage grows.
fail_under = 80

[tool.coverage.xml]
output = "coverage.xml"
